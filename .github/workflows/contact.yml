name: Forward contact enquiries

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  forward:
    if: contains(github.event.issue.labels.*.name, 'contact')
    runs-on: ubuntu-latest
    steps:
      # GitHub already emails every watcher when an issue opens, so the
      # enquiry lands in the inbox with no credentials anywhere. This step
      # only makes the notification useful and closes the loop.
      - name: Acknowledge, tag and close
        uses: actions/github-script@v7
        with:
          script: |
            const b = context.payload.issue.body || ''
            const grab = (h) => {
              const m = b.match(new RegExp('###\\\\s*' + h + '\\\\s*\\\\n+([\\\\s\\\\S]*?)(?=\\\\n###|$)'))
              return m ? m[1].trim() : ''
            }
            const email = grab('Email we should reply to')
            const topic = grab('What is this about')

            const labels = ['contact']
            const map = {
              'About our research': 'research',
              'Report something to us': 'report',
              'Talk or workshop': 'speaking',
              'Work on something together': 'collab',
            }
            if (map[topic]) labels.push(map[topic])
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, labels
            }).catch(() => {})

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                'Received. This reached both of us the moment you opened it.',
                '',
                'We read every message ourselves and reply' + (email ? ' to **' + email + '**' : '') + ' when we can.',
                '',
                'Closing the issue keeps the tracker tidy — it does not mean we missed it.'
              ].join('\n')
            })

            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed'
            })
