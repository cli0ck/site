<!-- cli0ck — notification email template.
     Paste this into EmailJS → Email Templates → Content → Edit as HTML.
     The {{...}} placeholders are filled by assets/contact.js.
     Table layout and inline styles: that is what mail clients actually render. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0;padding:0;background:#1c1917;">
<tr><td align="center" style="padding:32px 16px;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:620px;background:#292524;border:1px solid rgba(255,255,255,0.12);border-radius:12px;overflow:hidden;font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">

  <!-- masthead -->
  <tr><td style="padding:26px 28px 22px;border-bottom:1px solid rgba(255,255,255,0.12);">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
      <td style="font-size:22px;font-weight:700;color:#ffffff;letter-spacing:-0.5px;">
        cli<span style="color:#d97706;">0</span>ck
      </td>
      <td align="right" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:2.4px;text-transform:uppercase;color:rgba(255,255,255,0.42);">
        New enquiry
      </td>
    </tr></table>
  </td></tr>

  <!-- headline -->
  <tr><td style="padding:30px 28px 24px;">
    <div style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#f59e0b;padding-bottom:12px;">
      {{topic}}
    </div>
    <div style="font-size:27px;line-height:1.25;font-weight:600;color:#ffffff;letter-spacing:-0.4px;">
      {{name}}
    </div>
    <div style="font-size:15px;color:rgba(255,255,255,0.55);padding-top:7px;">
      {{company}}
    </div>
  </td></tr>

  <!-- the message -->
  <tr><td style="padding:0 28px 26px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#1c1917;border:1px solid rgba(255,255,255,0.10);border-left:3px solid #d97706;border-radius:8px;">
      <tr><td style="padding:22px 24px;">
        <div style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;font-weight:600;letter-spacing:2.6px;text-transform:uppercase;color:rgba(255,255,255,0.38);padding-bottom:14px;">
          Message
        </div>
        <div style="font-size:16px;line-height:1.72;color:rgba(255,255,255,0.88);white-space:pre-wrap;">{{message}}</div>
      </td></tr>
    </table>
  </td></tr>

  <!-- reply button -->
  <tr><td style="padding:0 28px 28px;">
    <table role="presentation" cellpadding="0" cellspacing="0"><tr>
      <td style="border-radius:9999px;background:#d97706;">
        <a href="mailto:{{email}}?subject=Re:%20your%20message%20to%20cli0ck"
           style="display:inline-block;padding:14px 30px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:9999px;">
          Reply to {{name}} &nbsp;&rarr;
        </a>
      </td>
    </tr></table>
    <div style="font-size:13px;color:rgba(255,255,255,0.38);padding-top:12px;">
      Or just hit reply &mdash; this email is already addressed to them.
    </div>
  </td></tr>

  <!-- the record -->
  <tr><td style="padding:0 28px 28px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-top:1px solid rgba(255,255,255,0.12);">
      <tr>
        <td width="34%" style="padding:14px 0 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:rgba(255,255,255,0.38);vertical-align:top;">Email</td>
        <td style="padding:14px 0 0;font-size:14px;color:#ffffff;"><a href="mailto:{{email}}" style="color:#f59e0b;text-decoration:none;">{{email}}</a></td>
      </tr>
      <tr>
        <td style="padding:11px 0 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:rgba(255,255,255,0.38);vertical-align:top;">Company</td>
        <td style="padding:11px 0 0;font-size:14px;color:rgba(255,255,255,0.82);">{{company}}</td>
      </tr>
      <tr>
        <td style="padding:11px 0 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:rgba(255,255,255,0.38);vertical-align:top;">Topic</td>
        <td style="padding:11px 0 0;font-size:14px;color:rgba(255,255,255,0.82);">{{topic}}</td>
      </tr>
      <tr>
        <td style="padding:11px 0 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:rgba(255,255,255,0.38);vertical-align:top;">Received</td>
        <td style="padding:11px 0 0;font-size:14px;color:rgba(255,255,255,0.82);">{{sent_at}}</td>
      </tr>
    </table>
  </td></tr>

  <!-- footer -->
  <tr><td style="padding:18px 28px;border-top:1px solid rgba(255,255,255,0.12);background:#1c1917;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
      <td style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:rgba(255,255,255,0.3);">
        cli0ck.com/contact
      </td>
      <td align="right" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:rgba(255,255,255,0.3);">
        Riyadh
      </td>
    </tr></table>
  </td></tr>

</table>
</td></tr>
</table>
